# ============================================================================
# OPTIMIZED PARAMETERS (Result of Phase 2 systematic testing)
# ============================================================================

# Points Per Side: Grid density for SAM prompts
# Phase 1: 6×6 = 36 prompts | Phase 2: 4×4 = 16 prompts
# Impact: -8.8% F1, +80% FPS (primary speed driver)
points_per_side: 4

# Maximum Masks Per Frame
# Phase 1: 24 | Phase 2: 12
# Impact: 0% F1 loss, +1% FPS (zero-cost optimization)
max_masks: 12

# Mask Confidence Threshold
# Phase 1: 0.80 | Phase 2: 0.70
# Impact: +0.04% F1, balanced precision/recall
mask_threshold: 0.70

# Minimum Mask Size (pixels)
# Phase 1 & 2: 3500 (confirmed optimal)
# Impact: Baseline optimal; reduction hurts F1
min_mask_pixels: 3500

# Non-Maximum Suppression IoU Threshold
# Phase 1: 0.20 | Phase 2: 0.30 (looser)
# Impact: +0.8% F1, +1.4% FPS (partial recovery + speed)
nms_iou: 0.30

