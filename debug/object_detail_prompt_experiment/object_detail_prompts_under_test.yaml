    name: "V1 - basic object_detail addition"
    provenance: "baseline + one short appended section requesting a 5th JSON key, object_detail. First iteration -- deliberately minimal, per the plan to start basic and build systematically. See EXPERIMENT_REPORT.md section 4 for the design rationale and section 14 for the predicted OUTPUT/GOOD-example conflict this version knowingly ships with."
    active: true
