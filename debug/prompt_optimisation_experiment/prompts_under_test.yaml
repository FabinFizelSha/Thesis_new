# Prompts under test - fresh prompt-optimisation experiment (2026-08-31)
#
# Three versions, run identically against 3 model profiles (9 runs total).
# Schema matches src/rsg/nodes/support/phase1/vlm_prompt_optimization.yaml
# (prompts.<id>.template). Set exactly one `active: true` per run.
#
# DESIGN
# - Complexity gradient:  P1 = simple / zero-shot   ->   P2 = simple + many
#   examples   ->   P3 = detailed reasoning strategy + calibration + grouped
#   examples.
# - NO enumerated label lists in any prompt. The model must generalise and name
#   whatever the object is; restricted vocabularies hurt generalisation.
# - All three specify the JSON output format explicitly AND end with a
#   "return only the JSON object" instruction.
# - Shared core across all three: cyan boundary, identical JSON schema, identical
#   mobility definitions, VLM_unknown fallback.
#
# BOUNDARY COLOUR: cyan. The live pipeline contour must be set to cyan for this
# experiment:  semantic_crop.target_contour_rgb: [0, 255, 255]  (currently white).
# See EXPERIMENT_REPORT.md sections 4 and 5.

prompts:

  P1_v1_simplified:
    name: "P1 - simple (short, zero-shot, general)"
    provenance: "adapted from v1_simplified - label enumeration removed, JSON-only line added"
    prior_qwen3vl8b_accuracy: 0.469
    active: true
    template: |
      Classify the single SAM-segmented target in this indoor crop.

      The target object is the one outlined by the cyan boundary. Identify only this object. The surrounding area may be used as context to help identify it.

      Assume an indoor setting.

      Name the object with a concise, singular, lowercase snake_case label that best describes what it actually is. There is no fixed list of labels. Do not describe colour, material, position, condition or activity. Use a confidence above 0.90 only when the identification is unmistakable. If the target is unclear, truncated or unidentifiable, use the label VLM_unknown with confidence 0.0.

      Mobility:
      - "dynamic": a human, an animal, or a self-propelled robot only
      - "static": everything else
      - "unknown": when the label is unknown or mobility cannot be determined

      Output exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      Return only the JSON object. No markdown, explanations, or extra text.

  P2_v5_examples_based:
    name: "P2 - example-driven (simple rules + many worked examples, general)"
    provenance: "reconstructed from v5_examples_based - label list removed, examples broadened, dynamic example added"
    prior_qwen3vl8b_accuracy: 0.518
    active: false
    template: |
      Classify the main object outlined by the cyan boundary in this indoor crop.

      Rules:
      - Identify only the object inside the cyan boundary. Ignore anything outside it.
      - Name the broadest, largest, most dominant object the boundary covers. When a surface such as a ceiling, wall or floor contains fixtures, attachments or details, name the surface, not the smaller thing on it.
      - Use a concise, singular, lowercase label that best fits what you see. There is no fixed list of labels.
      - Use a confidence above 0.90 only when the identification is unmistakable.
      - If the crop is unclear or truncated, use label VLM_unknown with confidence 0.0.

      Mobility:
      - "dynamic": a human, an animal, or a self-propelled robot only
      - "static": everything else
      - "unknown": when the label is unknown

      Output exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      Examples (these show the reasoning pattern, not a list of allowed labels):
      - Recessed lights set into a ceiling panel -> {"label": "ceiling", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - A ceiling panel with embedded vents and fixtures -> {"label": "ceiling", "label_confidence": 0.91, "mobility_class": "static", "mobility_confidence": 0.99}
      - A wall with a whiteboard mounted on it -> {"label": "wall", "label_confidence": 0.90, "mobility_class": "static", "mobility_confidence": 0.99}
      - A wall with an air-conditioning unit on it -> {"label": "wall", "label_confidence": 0.89, "mobility_class": "static", "mobility_confidence": 0.99}
      - A floor with a rug lying on it -> {"label": "floor", "label_confidence": 0.90, "mobility_class": "static", "mobility_confidence": 0.99}
      - A door and its frame -> {"label": "door", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - A window with a view behind it -> {"label": "window", "label_confidence": 0.90, "mobility_class": "static", "mobility_confidence": 0.99}
      - An office chair filling most of the frame -> {"label": "office_chair", "label_confidence": 0.91, "mobility_class": "static", "mobility_confidence": 0.99}
      - A potted plant on a stand -> {"label": "potted_plant", "label_confidence": 0.88, "mobility_class": "static", "mobility_confidence": 0.95}
      - A person standing in the space -> {"label": "person", "label_confidence": 0.93, "mobility_class": "dynamic", "mobility_confidence": 0.98}
      - A blurred or cut-off crop with no identifiable object -> {"label": "VLM_unknown", "label_confidence": 0.0, "mobility_class": "unknown", "mobility_confidence": 0.0}

      Return only the JSON object. No markdown, explanations, or extra text.

  P3_v6_structural_priority:
    name: "P3 - detailed (reasoning strategy + confidence calibration + grouped examples, general)"
    provenance: "adapted from live v6_structural_priority - structural-label enumeration generalised, dynamic example added"
    prior_qwen3vl8b_accuracy: 0.500
    active: false
    template: |
      This is an indoor object-classification task. Identify the main object outlined by the cyan boundary.

      Approach:
      1. Look only inside the cyan boundary. Ignore anything outside it completely.
      2. Decide what the largest, most dominant thing inside the boundary is.
      3. Prefer the broadest structure over the details on it:
         - The surfaces and structures that form the room itself - the large planes overhead, underfoot and to the sides, together with the openings and supports in them - take priority over anything mounted on, set into, or resting against them.
         - A freestanding piece of furniture takes priority over the smaller objects attached to or placed on it.
         - When two objects compete, choose the larger and more dominant one.
         - When a surface carries fixtures, attachments or markings, name the surface, not the fixture.
      4. Give the object a concise, singular, lowercase label that best describes what it actually is. There is no fixed list of labels.

      Confidence calibration for "label_confidence":
      - 0.90-1.00: unmistakable, no ambiguity
      - 0.70-0.90: clear, minor uncertainty
      - 0.50-0.70: plausible but competing interpretations
      - below 0.50: very uncertain
      - 0.0: incomprehensible crop (use label VLM_unknown)

      Mobility:
      - "dynamic": only a human, an animal, or a self-propelled moving object
      - "static": any stationary object, including all surfaces, structures, furniture and fixtures
      - "unknown": when the label is unknown

      Output format (required) - exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      Worked examples (illustrating the approach, not a list of allowed labels):

      Room-defining structures take priority over their details:
      - Recessed lights set into a ceiling panel -> {"label": "ceiling", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - A ceiling panel with embedded vents and fixtures -> {"label": "ceiling", "label_confidence": 0.91, "mobility_class": "static", "mobility_confidence": 0.99}
      - A wall carrying a whiteboard or a mounted sign -> {"label": "wall", "label_confidence": 0.89, "mobility_class": "static", "mobility_confidence": 0.99}
      - A floor with a rug or carpet on it -> {"label": "floor", "label_confidence": 0.90, "mobility_class": "static", "mobility_confidence": 0.99}
      - A door and its opening -> {"label": "door", "label_confidence": 0.93, "mobility_class": "static", "mobility_confidence": 0.99}

      Furniture takes priority over the objects on it:
      - An office chair filling most of the frame -> {"label": "office_chair", "label_confidence": 0.91, "mobility_class": "static", "mobility_confidence": 0.99}
      - A desk seen clearly, with items on top -> {"label": "desk", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - A sofa or couch -> {"label": "sofa", "label_confidence": 0.90, "mobility_class": "static", "mobility_confidence": 0.99}

      Moving agents:
      - A person in the space -> {"label": "person", "label_confidence": 0.93, "mobility_class": "dynamic", "mobility_confidence": 0.98}

      Unclear:
      - A blurred, truncated or unidentifiable crop -> {"label": "VLM_unknown", "label_confidence": 0.0, "mobility_class": "unknown", "mobility_confidence": 0.0}

      Return only the JSON object. No markdown, explanations, or additional text.
