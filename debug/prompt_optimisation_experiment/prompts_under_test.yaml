# Prompts under test - fresh prompt-optimisation experiment (2026-08-31)
#
# Three versions, run identically against 3 model profiles (9 runs total).
# Schema matches src/rsg/nodes/support/phase1/vlm_prompt_optimization.yaml
# (prompts.<id>.template). Set exactly one `active: true` per run.
#
# DESIGN
# - Complexity gradient:  P1 = simple / zero-shot   ->   P2 = simple + many
#   examples   ->   P3 = detailed reasoning strategy + calibration + grouped
#   examples.
# - NO enumerated label lists in any prompt. The model must generalise and name
#   whatever the object is; restricted vocabularies hurt generalisation.
# - All three specify the JSON output format explicitly AND end with a
#   "return only the JSON object" instruction.
# - Shared core across all three: cyan boundary, identical JSON schema, identical
#   mobility definitions, VLM_no_result fallback.
#
# BOUNDARY COLOUR: cyan. The live pipeline contour must be set to cyan for this
# experiment:  semantic_crop.target_contour_rgb: [0, 255, 255]  (currently white).
# See EXPERIMENT_REPORT.md sections 4 and 5.

prompts:

  P1_v1_simplified:
    name: "P1 - simple (short, zero-shot, general)"
    provenance: "adapted from v1_simplified - label enumeration removed, JSON-only line added"
    prior_qwen3vl8b_accuracy: 0.469
    r1_accuracy: 0.48   # session_20260901_195516, 24/50
    active: false
    template: |
      Classify the single SAM-segmented target in this indoor crop.

      The target object is the one outlined by the cyan boundary. Identify only this object. The surrounding area may be used as context to help identify it.

      Assume an indoor setting.

      Name the object with a concise, singular, lowercase snake_case label that best describes what it actually is. There is no fixed list of labels. Do not describe colour, material, position, condition or activity. Use a confidence above 0.90 only when the identification is unmistakable. If the target is unclear, truncated or unidentifiable, use the label VLM_no_result with confidence 0.0.

      Mobility:
      - "dynamic": a human, an animal, or a self-propelled robot only
      - "static": everything else
      - "unknown": when the label is unknown or mobility cannot be determined

      Output exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      Return only the JSON object. No markdown, explanations, or extra text.

  P2_v5_examples_based:
    name: "P2 - example-driven (boundary-focus + generalisation rules + worked examples from R1, general)"
    provenance: "reworked from v5_examples_based after R1 (P1 @ 48%): elaborated boundary-only rule, added 'multiple instances / surface-with-fixture -> name the enclosing surface' rule, added confidence calibration to stop 0.95-on-everything, examples taken from real R1 misses. Still open-vocabulary - no label list."
    prior_qwen3vl8b_accuracy: 0.518
    r2_accuracy: 0.72   # session_20260901_204248, 36/50 (+24 pp over R1)
    active: false
    template: |
      Identify the object that the cyan boundary encloses in this indoor crop.

      WHICH OBJECT TO NAME
      - The cyan boundary marks one region of the image. Name only what lies inside that boundary.
      - Everything outside the boundary is background. A large, obvious object outside the boundary - a chair, a shelf, a bookcase, a whiteboard, a plant - is NOT the answer. Use the surroundings only to understand what the enclosed region is, never as the label itself.
      - First decide what the enclosed region mainly shows, then name that.

      HOW TO CHOOSE THE LABEL
      - Name the largest, most complete thing the boundary covers. If the boundary encloses only part of a bigger structure, name the bigger structure.
      - If the boundary spans many repeated units of one surface - several ceiling tiles or panels, a run of floor, a stretch of wall - name the surface itself ("ceiling", "floor", "wall"), not a single unit ("ceiling_tile").
      - If the boundary covers a surface that carries a smaller mounted or attached item - a wall bearing a whiteboard, sign, monitor or vent; a ceiling holding a light or diffuser; a floor with a rug on it - name the surface, not the attached item. Name the attached item only when it clearly fills the boundary on its own.
      - When you are torn between a specific object and the surface or structure behind it, choose the surface or structure.
      - Use a concise, singular, lowercase label that best fits what you actually see. There is no fixed list of labels - name whatever it is.

      CONFIDENCE ("label_confidence") - be honest, do not default to 0.95
      - 0.90-1.00: unmistakable; the enclosed region can only be this.
      - 0.60-0.85: probable, but a competing reading exists.
      - 0.30-0.55: genuinely ambiguous, low detail, or a guess.
      - 0.0 with label VLM_no_result: too blurred, dark, or truncated to identify at all.
      Do not report 0.90+ on a crop you would not bet on.

      Mobility:
      - "dynamic": a human, an animal, or a self-propelled robot only
      - "static": everything else
      - "unknown": when the label is unknown or mobility cannot be determined

      Output exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      WORKED EXAMPLES (these show the reasoning, not a list of allowed labels):
      - Boundary is on a wall plane; an armchair sits in front of it, outside the boundary -> {"label": "wall", "label_confidence": 0.86, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary is on the floor; a shelf unit stands beyond it, outside the boundary -> {"label": "floor", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary spans a panelled ceiling covering many tiles and a light fixture -> {"label": "ceiling", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary covers a wall area that has a whiteboard mounted on part of it -> {"label": "wall", "label_confidence": 0.85, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary covers a single whiteboard that fills almost the whole region -> {"label": "whiteboard", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary is on a flat vertical surface with little detail - could be a cabinet front, a pillar or a wall -> {"label": "wall", "label_confidence": 0.4, "mobility_class": "static", "mobility_confidence": 0.9}
      - Boundary shows a reflective rectangular panel on a wall - could be a mirror or a whiteboard -> {"label": "wall", "label_confidence": 0.4, "mobility_class": "static", "mobility_confidence": 0.9}
      - Boundary encloses a recessed light set into a ceiling panel -> {"label": "ceiling", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary encloses a floor with a rug lying on it -> {"label": "floor", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary encloses a potted plant that fills the region -> {"label": "potted_plant", "label_confidence": 0.88, "mobility_class": "static", "mobility_confidence": 0.95}
      - Boundary encloses a door and its frame -> {"label": "door", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary encloses a person standing in the space -> {"label": "person", "label_confidence": 0.93, "mobility_class": "dynamic", "mobility_confidence": 0.98}
      - Boundary region is blurred, dark or cut off with no identifiable object -> {"label": "VLM_no_result", "label_confidence": 0.0, "mobility_class": "unknown", "mobility_confidence": 0.0}

      Return only the JSON object. No markdown, explanations, or extra text.

  P3_v6_structural_priority:
    name: "P3 - detailed (structural priority + calibration + grouped examples, tuned on R1+R2, general)"
    provenance: "built on P2 @ R2 72%. Keeps P2's wins (boundary discipline, generalise repeated surface units, surface-over-mounted-fixture). Adds fixes for the 3 R2 failure clusters: (1) distinctive infrastructure that fills the boundary is NAMED, not generalised to the surface (pipes/vents/ducts -> ceiling was wrong); (2) glass partitions / glass-panelled doors get a glass label (were called wall/door); (3) discriminative cue for flat-surface cabinet-vs-wall/pillar + wider honest confidence band for it. Still open-vocabulary - no label list."
    prior_qwen3vl8b_accuracy: 0.500
    r2_baseline_accuracy: 0.72   # P2 @ session_20260901_204248
    active: false
    template: |
      This is an indoor object-classification task. Identify the object that the cyan boundary encloses.

      APPROACH
      1. Look only inside the cyan boundary. Everything outside it is background - never name it, however large or obvious. Use the surroundings only to work out what the enclosed region is.
      2. Decide what the enclosed region mainly shows.
      3. Choose the label using the priority order below.

      PRIORITY ORDER
      a. Room-defining structure over incidental detail. The large planes that form the room - overhead, underfoot, the vertical sides - and the openings and supports in them take priority over small things mounted on, set into, or resting against them. If the boundary spans many repeated units of one surface (several ceiling tiles or panels, a run of floor, a stretch of wall), name the surface itself ("ceiling", "wall", "floor"), not one unit ("ceiling_tile").
      b. BUT distinctive infrastructure that fills the boundary is named, not generalised. If exposed pipes, ductwork, a large air vent or diffuser, a fire hose reel, a sprinkler main or a big fixture dominates the enclosed region, name that thing. Collapsing to "ceiling" or "wall" is only right when the fixture is small or incidental and the surface is what the boundary mostly shows.
      c. Furniture over the objects on it - but only with a furniture cue. A freestanding piece of furniture outranks the smaller things on it. A large flat vertical surface with no handle, seam, gap, toe-kick or visible depth is a wall or a pillar, not a cabinet - do not upgrade a plain surface to furniture without a cue.
      d. When two readings compete, choose the larger, more dominant, more structural one.

      MATERIAL AND AMBIGUITY CUES
      - A transparent or translucent panel, a framed glass screen, a glazed partition or a glass-panelled door -> name it as glass (for example "glass_wall", "glass_partition", "glass_door"). Offices often divide space with glass rather than solid wall.
      - Judge transparency directly: if the room, objects, people or light behind the panel are visible through it - even dimly, even with a frame, mullions or a faint surface reflection - it is glass; a panel you cannot see through at all is solid (wall, door, cabinet).
      - A rectangular panel that reflects the room or shows a mirror image -> mirror. A plain matte white or lightly-marked panel -> whiteboard. If you cannot tell, name the wall it sits on at low confidence.
      - Low detail, deep shadow, motion blur or heavy truncation -> do not commit to a specific object; give the structural reading (wall / floor / ceiling) at low confidence, or VLM_no_result if nothing is identifiable.

      LABEL FORM
      - A concise, singular, lowercase label that best describes what it actually is. There is no fixed list of labels - name whatever it is. Do not describe colour, condition or activity.

      CONFIDENCE CALIBRATION for "label_confidence" - report it honestly
      - 0.90-1.00: unmistakable; the enclosed region can only be this.
      - 0.70-0.90: clear, minor uncertainty.
      - 0.45-0.70: plausible, but a competing reading exists - the right band for cabinet-vs-wall and mirror-vs-whiteboard.
      - 0.20-0.45: genuinely ambiguous, or a guess.
      - 0.0 with label VLM_no_result: incomprehensible crop.
      A low confidence on a hard crop is better than a confident wrong answer. Do not default to 0.90+.

      Mobility:
      - "dynamic": only a human, an animal, or a self-propelled moving object
      - "static": any stationary object, including all surfaces, structures, furniture, glass and fixtures
      - "unknown": when the label is unknown

      Output format (required) - exactly one JSON object:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      WORKED EXAMPLES (illustrating the approach, not a list of allowed labels):

      Room-defining structure over incidental detail:
      - Boundary spans a panelled ceiling covering many tiles and a recessed light -> {"label": "ceiling", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary covers a wall area with a whiteboard mounted on part of it -> {"label": "wall", "label_confidence": 0.85, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary on a wall plane; an armchair sits in front of it, outside the boundary -> {"label": "wall", "label_confidence": 0.86, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary on a floor area with a rug on it -> {"label": "floor", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}

      Distinctive infrastructure that fills the boundary - name it:
      - Exposed pipes or ductwork running across the ceiling, filling the boundary -> {"label": "pipes", "label_confidence": 0.8, "mobility_class": "static", "mobility_confidence": 0.99}
      - A large air vent or diffuser that dominates the enclosed region -> {"label": "air_vent", "label_confidence": 0.82, "mobility_class": "static", "mobility_confidence": 0.99}
      - A fire hose reel on the wall, filling the boundary -> {"label": "fire_hose_reel", "label_confidence": 0.85, "mobility_class": "static", "mobility_confidence": 0.99}

      Glass and reflective surfaces:
      - A framed glass partition dividing two areas -> {"label": "glass_wall", "label_confidence": 0.8, "mobility_class": "static", "mobility_confidence": 0.99}
      - A glass-panelled door in a frame -> {"label": "glass_door", "label_confidence": 0.82, "mobility_class": "static", "mobility_confidence": 0.99}
      - A reflective rectangular panel showing a mirror image of the room -> {"label": "mirror", "label_confidence": 0.75, "mobility_class": "static", "mobility_confidence": 0.99}
      - A plain white rectangular panel on a wall, no reflection -> {"label": "whiteboard", "label_confidence": 0.7, "mobility_class": "static", "mobility_confidence": 0.99}

      Furniture vs plain surface:
      - An office chair filling most of the frame -> {"label": "office_chair", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - A desk seen clearly, with items on top -> {"label": "desk", "label_confidence": 0.9, "mobility_class": "static", "mobility_confidence": 0.99}
      - A flat vertical surface with a visible handle, seam and toe-kick -> {"label": "cabinet", "label_confidence": 0.8, "mobility_class": "static", "mobility_confidence": 0.99}
      - A flat vertical surface with no handles, seams or depth cues -> {"label": "wall", "label_confidence": 0.5, "mobility_class": "static", "mobility_confidence": 0.95}

      Moving agents:
      - A person in the space -> {"label": "person", "label_confidence": 0.93, "mobility_class": "dynamic", "mobility_confidence": 0.98}

      Unclear:
      - A blurred, dark or truncated region with no identifiable object -> {"label": "VLM_no_result", "label_confidence": 0.0, "mobility_class": "unknown", "mobility_confidence": 0.0}

      Return only the JSON object. No markdown, explanations, or additional text.
  P3b_v6b_format_enforced:
    name: "P3b - P3 + hard JSON-format enforcement (R6.1, 4B). Same reasoning/priority/examples as P3; adds a top OUTPUT RULE, marks APPROACH as silent, and gives GOOD/BAD output examples."
    provenance: "R6 (qwen35_4b x P3) abandoned: P3's step-by-step APPROACH makes the 4B narrate the analysis in the visible content ('Based on the visual evidence... 1. Analysis...') instead of emitting JSON - 21/51 (max_tokens 96) then still a few at 256/512. Format failure, not a labelling failure. P3b keeps every P3 rule/example and only enforces output syntax: leading OUTPUT RULE block, 'reason silently', GOOD/BAD reply examples, stronger closing line. P3 itself is unchanged (frozen for R3)."
    active: true
    template: |
      OUTPUT RULE — READ THIS FIRST
      Your entire reply is ONE JSON object and nothing else. The first character you output is "{" and the last is "}". No preamble, no analysis, no numbered steps, no sentences such as "Based on the visual evidence...", and no markdown code fences. Work through the approach below silently and output only the result.

      This is an indoor object-classification task. Identify the object that the cyan boundary encloses.

      APPROACH (reason through this silently - do not write any of it)
      1. Look only inside the cyan boundary. Everything outside it is background - never name it, however large or obvious. Use the surroundings only to work out what the enclosed region is.
      2. Decide what the enclosed region mainly shows.
      3. Choose the label using the priority order below.

      PRIORITY ORDER
      a. Room-defining structure over incidental detail. The large planes that form the room - overhead, underfoot, the vertical sides - and the openings and supports in them take priority over small things mounted on, set into, or resting against them. If the boundary spans many repeated units of one surface (several ceiling tiles or panels, a run of floor, a stretch of wall), name the surface itself ("ceiling", "wall", "floor"), not one unit ("ceiling_tile").
      b. BUT distinctive infrastructure that fills the boundary is named, not generalised. If exposed pipes, ductwork, a large air vent or diffuser, a fire hose reel, a sprinkler main or a big fixture dominates the enclosed region, name that thing. Collapsing to "ceiling" or "wall" is only right when the fixture is small or incidental and the surface is what the boundary mostly shows.
      c. Furniture over the objects on it - but only with a furniture cue. A freestanding piece of furniture outranks the smaller things on it. A large flat vertical surface with no handle, seam, gap, toe-kick or visible depth is a wall or a pillar, not a cabinet - do not upgrade a plain surface to furniture without a cue.
      d. When two readings compete, choose the larger, more dominant, more structural one.

      MATERIAL AND AMBIGUITY CUES
      - A transparent or translucent panel, a framed glass screen, a glazed partition or a glass-panelled door -> name it as glass (for example "glass_wall", "glass_partition", "glass_door"). Offices often divide space with glass rather than solid wall.
      - Judge transparency directly: if the room, objects, people or light behind the panel are visible through it - even dimly, even with a frame, mullions or a faint surface reflection - it is glass; a panel you cannot see through at all is solid (wall, door, cabinet).
      - A rectangular panel that reflects the room or shows a mirror image -> mirror. A plain matte white or lightly-marked panel -> whiteboard. If you cannot tell, name the wall it sits on at low confidence.
      - Low detail, deep shadow, motion blur or heavy truncation -> do not commit to a specific object; give the structural reading (wall / floor / ceiling) at low confidence, or VLM_no_result if nothing is identifiable.

      LABEL FORM
      - A concise, singular, lowercase label that best describes what it actually is. There is no fixed list of labels - name whatever it is. Do not describe colour, condition or activity.

      CONFIDENCE CALIBRATION for "label_confidence" - report it honestly
      - 0.90-1.00: unmistakable; the enclosed region can only be this.
      - 0.70-0.90: clear, minor uncertainty.
      - 0.45-0.70: plausible, but a competing reading exists - the right band for cabinet-vs-wall and mirror-vs-whiteboard.
      - 0.20-0.45: genuinely ambiguous, or a guess.
      - 0.0 with label VLM_no_result: incomprehensible crop.
      A low confidence on a hard crop is better than a confident wrong answer. Do not default to 0.90+.

      Mobility:
      - "dynamic": only a human, an animal, or a self-propelled moving object
      - "static": any stationary object, including all surfaces, structures, furniture, glass and fixtures
      - "unknown": when the label is unknown

      OUTPUT - exactly one JSON object, with nothing before it or after it:
      {"label": "<label>", "label_confidence": <0-1>, "mobility_class": "<static|dynamic|unknown>", "mobility_confidence": <0-1>}

      GOOD - this is the whole reply:
      {"label": "wall", "label_confidence": 0.85, "mobility_class": "static", "mobility_confidence": 0.99}

      BAD - never reply like any of these:
      - Based on the visual evidence within the cyan boundary: 1. Analysis: ... then the JSON
      - The object is a wall. {"label": "wall", ...}
      - the JSON object wrapped in triple-backtick code fences

      WORKED EXAMPLES (illustrating the approach, not a list of allowed labels):

      Room-defining structure over incidental detail:
      - Boundary spans a panelled ceiling covering many tiles and a recessed light -> {"label": "ceiling", "label_confidence": 0.92, "mobility_class": "static", "mobility_confidence": 0.99}
      - Boundary covers a wall area with a whiteboard mounted on part of it -> {"label": "wall", "label_confidence": 0.85, "mobility_class": "static", "mobility_confidence": 0.99}
